[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "genkavya"
version = "0.1.0"
description = "Modular Sanskrit poetry generation contracts and services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
rag = [
    "faiss-cpu>=1.11,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
]
validation = ["chanda>=1.1,<1.2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/genkavya"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

